services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Africa/Cairo
      - TZ=Africa/Cairo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - job-agent-net

  job-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: job-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TZ=Africa/Cairo
      - FIT_THRESHOLD_SHORTLIST=80
      - FIT_THRESHOLD_REVIEW=65
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    networks:
      - job-agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  n8n_data:
    external: true

networks:
  job-agent-net:
    driver: bridge
